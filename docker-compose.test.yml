# ================================
# TESTING - Docker Compose
# ================================
# Isolated testing environment separate from production
#
# Usage:
#   docker-compose -f docker-compose.test.yml up -d
#   docker-compose -f docker-compose.test.yml down
#   docker-compose -f docker-compose.test.yml down -v  # Remove volumes too
#
# Run E2E tests:
#   docker exec library-api-test npm run test:e2e
# ================================

services:
  # ----- Web Client Test -----
  web-client-test:
    build:
      context: ./apps/web-client
      dockerfile: docker/Dockerfile
      args:
        API_URL: http://api-test:3000
    container_name: library-web-test
    ports:
      - "4200:80"
    depends_on:
      api-test:
        condition: service_healthy
    networks:
      - library-test-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # ----- API Test -----
  api-test:
    build:
      context: ./apps/api
      dockerfile: docker/Dockerfile
    container_name: library-api-test
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=test
      - PORT=3000
      - LOG_LEVEL=debug
      - DATABASE_URL=postgresql://library:library_test@postgres-test:5432/library_test
      - OLLAMA_BASE_URL=http://ollama-test:11434
      - OLLAMA_MODEL=nomic-embed-text
      - TRANSLATION_MODEL=qwen2.5:3b
    depends_on:
      postgres-test:
        condition: service_healthy
      ollama-test:
        condition: service_started
    networks:
      - library-test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ----- PostgreSQL Test -----
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: library-postgres-test
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=library_test
      - POSTGRES_USER=library
      - POSTGRES_PASSWORD=library_test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./docs/db/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - library-test-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ----- Ollama Test -----
  ollama-test:
    image: ollama/ollama:latest
    container_name: library-ollama-test
    ports:
      - "11435:11434"
    volumes:
      - ollama_test_data:/root/.ollama
    networks:
      - library-test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

# ----- Networks -----
networks:
  library-test-network:
    driver: bridge

# ----- Volumes -----
volumes:
  postgres_test_data:
    name: library-postgres-data-test
  ollama_test_data:
    name: library-ollama-data-test
