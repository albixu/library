# ================================
# TESTING - Docker Compose
# ================================
# Isolated testing environment separate from production
#
# Usage:
#   docker-compose -f docker-compose.test.yml up -d
#   docker-compose -f docker-compose.test.yml down
#   docker-compose -f docker-compose.test.yml down -v  # Remove volumes too
#
# Run E2E tests:
#   docker exec library-api-test npm run test:e2e
# ================================

services:
  # ----- Web Client Test -----
  web-client-test:
    build:
      context: ./apps/web-client
      dockerfile: docker/Dockerfile.dev
    container_name: library-web-test
    ports:
      - "4201:4200"
    volumes:
      - ./apps/web-client/src:/app/src
      - ./apps/web-client/public:/app/public
      - ./apps/web-client/e2e:/app/e2e
      - ./apps/web-client/package.json:/app/package.json
      - ./apps/web-client/tsconfig.json:/app/tsconfig.json
      - ./apps/web-client/tsconfig.app.json:/app/tsconfig.app.json
      - ./apps/web-client/tsconfig.spec.json:/app/tsconfig.spec.json
      - ./apps/web-client/angular.json:/app/angular.json
      - ./apps/web-client/eslint.config.js:/app/eslint.config.js
      - ./apps/web-client/playwright.config.ts:/app/playwright.config.ts
      - ./apps/web-client/.prettierrc:/app/.prettierrc
      - web_client_test_node_modules:/app/node_modules
      - web_client_test_angular_cache:/app/.angular
    environment:
      - NODE_ENV=test
      - NG_CLI_ANALYTICS=false
      - API_URL=http://api-test:3000
    depends_on:
      api-test:
        condition: service_healthy
    networks:
      - library-test-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ----- API Test -----
  api-test:
    build:
      context: ./apps/api
      dockerfile: docker/Dockerfile.dev
    container_name: library-api-test
    ports:
      - "3001:3000"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/tests:/app/tests
      - ./apps/api/scripts:/app/scripts
      - ./apps/api/data:/app/data
      - ./apps/api/package.json:/app/package.json
      - ./apps/api/tsconfig.json:/app/tsconfig.json
      - ./apps/api/vitest.config.ts:/app/vitest.config.ts
      - ./apps/api/vitest.integration.config.ts:/app/vitest.integration.config.ts
      - ./apps/api/vitest.e2e.config.ts:/app/vitest.e2e.config.ts
      - ./apps/api/drizzle.config.ts:/app/drizzle.config.ts
      - ./apps/api/eslint.config.js:/app/eslint.config.js
      - ./apps/api/drizzle:/app/drizzle
      - ./docs:/docs:ro
      - api_test_node_modules:/app/node_modules
    environment:
      - NODE_ENV=test
      - PORT=3000
      - LOG_LEVEL=debug
      - DATABASE_URL=postgresql://library:library_test@postgres-test:5432/library_test
      - OLLAMA_EMBEDDING_URL=http://ollama-embeddings-test:11434
      - OLLAMA_TRANSLATION_URL=http://ollama-translations-test:11434
      - OLLAMA_MODEL=nomic-embed-text
      - TRANSLATION_MODEL=llama3.2:1b
    depends_on:
      postgres-test:
        condition: service_healthy
      ollama-embeddings-test:
        condition: service_started
      ollama-translations-test:
        condition: service_started
    networks:
      - library-test-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))" ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ----- PostgreSQL Test -----
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: library-postgres-test
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=library_test
      - POSTGRES_USER=library
      - POSTGRES_PASSWORD=library_test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./docs/db/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U library -d library_test" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - library-test-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ----- Ollama Embeddings Test -----
  ollama-embeddings-test:
    image: ollama/ollama:latest
    container_name: library-ollama-embeddings-test
    ports:
      - "11435:11434"
    volumes:
      - ollama_embeddings_test_data:/root/.ollama
    networks:
      - library-test-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ----- Ollama Translations Test -----
  ollama-translations-test:
    image: ollama/ollama:latest
    container_name: library-ollama-translations-test
    ports:
      - "11436:11434"
    volumes:
      - ollama_translations_test_data:/root/.ollama
    networks:
      - library-test-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

# ----- Networks -----
networks:
  library-test-network:
    driver: bridge

# ----- Volumes -----
volumes:
  postgres_test_data:
    name: library-postgres-data-test
  ollama_embeddings_test_data:
    name: library-ollama-embeddings-data-test
  ollama_translations_test_data:
    name: library-ollama-translations-data-test
  api_test_node_modules:
    name: library-api-test-node-modules
  web_client_test_node_modules:
    name: library-web-client-test-node-modules
  web_client_test_angular_cache:
    name: library-web-client-test-angular-cache
