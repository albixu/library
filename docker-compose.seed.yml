# ================================
# SEED DATABASE - Docker Compose
# ================================
# Purpose: Load partitioned JSON files into PostgreSQL database
# Requires: docs/db/initial_data/books_XXXX.json files (generated by consolidate)
#
# IMPORTANT: By default, this seeds the PRODUCTION database.
# To seed development database, use: SEED_ENV=dev docker-compose -f docker-compose.seed.yml up -d
#
# Usage:
#   1. Stop all other containers first:
#      docker-compose down
#      docker-compose -f docker-compose.prod.yml down
#
#   2. Start seed services:
#      docker-compose -f docker-compose.seed.yml up -d
#
#   3. Wait for services to be healthy:
#      docker-compose -f docker-compose.seed.yml ps
#
#   4. Ensure Ollama has the embedding model:
#      docker exec library-seed-ollama ollama pull nomic-embed-text
#
#   5. Run database migrations (if needed):
#      docker exec library-seed-api npm run db:migrate
#
#   6. Run seed script:
#      docker exec library-seed-api npm run seed:database
#
#   7. Stop services when done:
#      docker-compose -f docker-compose.seed.yml down
#
# Input: docs/db/initial_data/books_XXXX.json
# Output: Books loaded into PostgreSQL with embeddings
# ================================

services:
  # ----- API Application (Seeding) -----
  api:
    build:
      context: ./apps/api
      dockerfile: docker/Dockerfile.dev
    container_name: library-seed-api
    volumes:
      # Mount source code
      - ./apps/api/src:/app/src
      - ./apps/api/scripts:/app/scripts
      - ./apps/api/package.json:/app/package.json
      - ./apps/api/tsconfig.json:/app/tsconfig.json
      - ./apps/api/drizzle.config.ts:/app/drizzle.config.ts
      - ./apps/api/drizzle:/app/drizzle
      # Initial data directory (partitioned JSON files)
      - ./docs/db/initial_data:/app/data/initial_data:ro
      # Reuse development node_modules volume
      - api_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      # Database connection (uses POSTGRES_PASSWORD from .env for production)
      - DATABASE_URL=postgresql://library:${POSTGRES_PASSWORD:-library}@postgres:5432/library
      # Ollama for embeddings
      - OLLAMA_BASE_URL=http://ollama:11434
      - EMBEDDING_MODEL=nomic-embed-text
      # Seeding configuration
      - BATCH_SIZE=50
      - MAX_RETRIES=3
      # Path to initial data (inside container) - must match INITIAL_DATA_DIR expected by script
      - INITIAL_DATA_DIR=/app/data/initial_data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - seed-network
    # No restart - this is a one-time task
    restart: "no"
    # Memory limit
    deploy:
      resources:
        limits:
          memory: 2G

  # ----- PostgreSQL + pgvector -----
  postgres:
    image: pgvector/pgvector:pg16
    container_name: library-seed-postgres
    environment:
      - POSTGRES_DB=library
      - POSTGRES_USER=library
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-library}
    volumes:
      # Use PRODUCTION database volume
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seed-network
    restart: "no"

  # ----- Ollama (Embedding Model) -----
  ollama:
    image: ollama/ollama:latest
    container_name: library-seed-ollama
    volumes:
      # Use PRODUCTION ollama volume
      - ollama_data:/root/.ollama
    networks:
      - seed-network
    restart: "no"
    # Memory for embedding model (~500MB for nomic-embed-text)
    deploy:
      resources:
        limits:
          memory: 2G

# ----- Networks -----
networks:
  seed-network:
    driver: bridge

# ----- Volumes -----
volumes:
  # Use production volumes by default
  # These are NOT external - they will be created if they don't exist
  postgres_data:
    name: library-postgres-data-prod
  ollama_data:
    name: library-ollama-data-prod
  # Reuse development node_modules (external - must exist)
  api_node_modules:
    name: library-api-node-modules
    external: true
