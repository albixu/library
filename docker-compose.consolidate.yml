# ================================
# CONSOLIDATE BOOKS - Docker Compose
# ================================
# Purpose: Generate partitioned JSON files from original_data/
# This compose file is optimized for memory-intensive book consolidation
# with translation support.
#
# Usage:
#   1. Start services:
#      docker-compose -f docker-compose.consolidate.yml up -d
#
#   2. Wait for Ollama to be ready and pull translation model:
#      docker exec library-consolidate-ollama ollama pull qwen2.5:1.5b
#
#   3. Run consolidation script:
#      docker exec library-consolidate-api npm run consolidate:books
#
#   4. Stop services when done:
#      docker-compose -f docker-compose.consolidate.yml down
#
# Output: docs/db/initial_data/books_XXXX.json
# ================================

services:
  # ----- API Application (Consolidation) -----
  api:
    build:
      context: ./apps/api
      dockerfile: docker/Dockerfile.dev
    container_name: library-consolidate-api
    volumes:
      # Mount source code
      - ./apps/api/src:/app/src
      - ./apps/api/scripts:/app/scripts
      - ./apps/api/package.json:/app/package.json
      - ./apps/api/tsconfig.json:/app/tsconfig.json
      - ./apps/api/drizzle.config.ts:/app/drizzle.config.ts
      - ./apps/api/drizzle:/app/drizzle
      # Docs directory for consolidated output
      - ./docs:/app/docs
      # Original data directory (source JSON files)
      - ./original_data:/app/original_data
      # Reuse development node_modules volume
      - api_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      # Database connection (required for checking existing books)
      - DATABASE_URL=postgresql://library:library@postgres:5432/library
      # Ollama for translations
      - OLLAMA_BASE_URL=http://ollama:11434
      - TRANSLATION_MODEL=qwen2.5:1.5b
      # Increase timeout for translations (3 minutes)
      - TRANSLATION_TIMEOUT_MS=180000
      # Books per output file
      - BOOKS_PER_FILE=1000
      # Monorepo root mapping
      - MONOREPO_ROOT=/app
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - consolidate-network
    # No restart - this is a one-time task
    restart: "no"
    # Memory limit to prevent OOM
    deploy:
      resources:
        limits:
          memory: 2G

  # ----- PostgreSQL (for checking existing books) -----
  postgres:
    image: pgvector/pgvector:pg16
    container_name: library-consolidate-postgres
    environment:
      - POSTGRES_DB=library
      - POSTGRES_USER=library
      - POSTGRES_PASSWORD=library
    volumes:
      # Use the same data volume as development
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - consolidate-network
    restart: "no"

  # ----- Ollama (Translation Model) -----
  ollama:
    image: ollama/ollama:latest
    container_name: library-consolidate-ollama
    volumes:
      # Use the same ollama data volume
      - ollama_data:/root/.ollama
    networks:
      - consolidate-network
    restart: "no"
    # Memory for translation model (~1.5GB for qwen2.5:1.5b)
    deploy:
      resources:
        limits:
          memory: 4G

# ----- Networks -----
networks:
  consolidate-network:
    driver: bridge

# ----- Volumes -----
volumes:
  # Reuse existing volumes from development
  postgres_data:
    name: library-postgres-data
    external: true
  ollama_data:
    name: library-ollama-data
    external: true
  api_node_modules:
    name: library-api-node-modules
    external: true
