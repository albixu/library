# ================================
# CONSOLIDATE BOOKS - Docker Compose
# ================================
# Purpose: Generate partitioned JSON files from original_data/
# This compose file is optimized for memory-intensive book consolidation
# with translation support using an isolated Ollama translation container.
#
# Usage:
#   1. Start services:
#      docker-compose -f docker-compose.consolidate.yml up -d
#
#   2. Wait for Ollama to be ready and pull translation model:
#      docker exec library-consolidate-ollama ollama pull llama3.2:3b
#
#   3. Run consolidation script:
#      docker exec library-consolidate-api npm run consolidate:books
#
#   4. Stop services when done:
#      docker-compose -f docker-compose.consolidate.yml down
#
# Output: docs/db/initial_data/books_XXXX.json
# ================================

services:
  # ----- API Application (Consolidation) -----
  api:
    build:
      context: ./apps/api
      dockerfile: docker/Dockerfile.dev
    container_name: library-consolidate-api
    volumes:
      # Mount source code
      - ./apps/api/src:/app/src
      - ./apps/api/scripts:/app/scripts
      - ./apps/api/package.json:/app/package.json
      - ./apps/api/tsconfig.json:/app/tsconfig.json
      - ./apps/api/drizzle.config.ts:/app/drizzle.config.ts
      - ./apps/api/drizzle:/app/drizzle
      # Docs directory for consolidated output
      - ./docs:/app/docs
      # Original data directory (source JSON files)
      - ./original_data:/app/original_data
      # Reuse development node_modules volume
      - api_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgres://dummy:dummy@localhost:5432/dummy
      # Ollama for translations
      - OLLAMA_TRANSLATION_URL=http://ollama-translations:11434
      - TRANSLATION_MODEL=llama3.2:3b
      # Increase timeout for translations (3 minutes)
      - TRANSLATION_TIMEOUT_MS=180000
      # Books per output file
      - BOOKS_PER_FILE=1000
      # Monorepo root mapping
      - MONOREPO_ROOT=/app
    depends_on:
      ollama-translations:
        condition: service_started
    networks:
      - consolidate-network
    # No restart - this is a one-time task
    restart: "no"
    # Memory limit to prevent OOM
    deploy:
      resources:
        limits:
          memory: 2G

  # ----- Ollama (Translation Model) -----
  ollama-translations:
    image: ollama/ollama:latest
    container_name: library-consolidate-ollama
    volumes:
      # Use the same ollama translations data volume
      - ollama_translations_data:/root/.ollama
    networks:
      - consolidate-network
    restart: "no"
    # Memory for translation model (~2.5GB for llama3.2:3b)
    deploy:
      resources:
        limits:
          memory: 8G

# ----- Networks -----
networks:
  consolidate-network:
    driver: bridge

# ----- Volumes -----
volumes:
  ollama_translations_data:
    name: library-ollama-translations-data
    external: true
  api_node_modules:
    name: library-api-node-modules
    external: true
