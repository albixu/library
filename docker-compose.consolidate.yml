# ================================
# CONSOLIDATE BOOKS - Docker Compose
# ================================
# Purpose: Generate partitioned JSON files from original_data/
# This compose file is optimized for memory-intensive book consolidation
# with translation support using LibreTranslate (fast, self-hosted).
#
# LibreTranslate is used as the translation provider for bulk operations
# (~120x faster than Ollama for large datasets).
#
# Usage:
#   1. Start services:
#      docker-compose -f docker-compose.consolidate.yml up -d
#
#   2. Wait for LibreTranslate to be ready (loads en+es models on startup):
#      docker logs -f library-consolidate-libretranslate
#      # Ready when you see: "Running on http://0.0.0.0:5000"
#
#   3. Run consolidation script:
#      docker exec library-consolidate-api npm run consolidate:books
#
#   4. Stop services when done:
#      docker-compose -f docker-compose.consolidate.yml down
#
# Output: docs/db/initial_data/books_XXXX.json
# ================================

services:
  # ----- API Application (Consolidation) -----
  api:
    build:
      context: ./apps/api
      dockerfile: docker/Dockerfile.dev
    container_name: library-consolidate-api
    volumes:
      # Mount source code
      - ./apps/api/src:/app/src
      - ./apps/api/scripts:/app/scripts
      - ./apps/api/package.json:/app/package.json
      - ./apps/api/tsconfig.json:/app/tsconfig.json
      - ./apps/api/drizzle.config.ts:/app/drizzle.config.ts
      - ./apps/api/drizzle:/app/drizzle
      # Cache directory for translation cache (persists between runs)
      - ./apps/api/tmp/cache:/app/tmp/cache
      # Docs directory for consolidated output
      - ./docs:/app/docs
      # Original data directory (source JSON files)
      - ./original_data:/app/original_data
      # Reuse development node_modules volume
      - api_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgres://dummy:dummy@localhost:5432/dummy
      # LibreTranslate for bulk translations (fast, self-hosted)
      - TRANSLATION_PROVIDER=libretranslate
      - LIBRETRANSLATE_URL=http://libretranslate:5000
      - LIBRETRANSLATE_TIMEOUT_MS=30000
      # Books per output file
      - BOOKS_PER_FILE=1000
      # Monorepo root mapping
      - MONOREPO_ROOT=/app
    depends_on:
      libretranslate:
        condition: service_started
    networks:
      - consolidate-network
    # No restart - this is a one-time task
    restart: "no"
    # Memory limit to prevent OOM
    deploy:
      resources:
        limits:
          memory: 2G

  # ----- LibreTranslate (Translation Service) -----
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: library-consolidate-libretranslate
    # Only load English and Spanish models for fast startup and low memory usage
    # 4 threads = matches TRANSLATION_CONCURRENCY=3, leaving 1 thread free
    command: --load-only en,es --threads 4
    networks:
      - consolidate-network
    restart: "no"
    # Memory for translation models (~1GB for en+es)
    deploy:
      resources:
        limits:
          memory: 2G

# ----- Networks -----
networks:
  consolidate-network:
    driver: bridge

# ----- Volumes -----
volumes:
  api_node_modules:
    name: library-api-node-modules
    external: true
