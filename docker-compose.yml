# ================================
# DEVELOPMENT - Docker Compose
# ================================
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up -d api          # Start only API and dependencies
#   docker-compose up -d web-client   # Start only web client
#   docker-compose logs -f api        # Follow api logs
#   docker-compose logs -f web-client # Follow web-client logs
#   docker-compose down               # Stop all services
#
# Web Client Commands:
#   docker exec library-web-client npm test          # Run unit tests
#   docker exec library-web-client npm run lint      # Run linting
#   docker exec library-web-client npm run build     # Build for production
#   docker exec -it library-web-client npm run storybook  # Start Storybook
#   docker exec library-web-client npm run test:e2e  # Run E2E tests
# ================================

services:
  # ----- API Application -----
  api:
    build:
      context: ./apps/api
      dockerfile: docker/Dockerfile.dev
    container_name: library-api-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload (writable for linting/formatting)
      - ./apps/api/src:/app/src
      - ./apps/api/tests:/app/tests
      - ./apps/api/scripts:/app/scripts
      - ./apps/api/data:/app/data
      - ./apps/api/package.json:/app/package.json
      - ./apps/api/package-lock.json:/app/package-lock.json
      - ./apps/api/tsconfig.json:/app/tsconfig.json
      - ./apps/api/vitest.config.ts:/app/vitest.config.ts
      - ./apps/api/vitest.integration.config.ts:/app/vitest.integration.config.ts
      - ./apps/api/vitest.e2e.config.ts:/app/vitest.e2e.config.ts
      - ./apps/api/drizzle.config.ts:/app/drizzle.config.ts
      - ./apps/api/eslint.config.js:/app/eslint.config.js
      - ./apps/api/drizzle:/app/drizzle
      # Docs directory for consolidated output
      - ./docs:/app/docs
      # Books directory (read-only mount for email delivery)
      - ${BOOKS_PATH}:/books:ro
      # Original data directory (source JSON files for consolidation)
      - ./original_data:/app/original_data
      # Named volume for node_modules (prevents overwrite by host)
      - api_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://library:${POSTGRES_PASSWORD}@postgres:5432/library
      - OLLAMA_EMBEDDING_URL=http://ollama-embeddings:11434
      - OLLAMA_TRANSLATION_URL=http://ollama-translations:11435
      - DOCS_PATH=/app/docs
      # Monorepo root for consolidate-books script (in Docker, /app is the root)
      - MONOREPO_ROOT=/app
      # Set AUTO_SEED=true to seed database on first run if empty
      - AUTO_SEED=false
    depends_on:
      postgres:
        condition: service_healthy
      ollama-embeddings:
        condition: service_started
      ollama-translations:
        condition: service_started
    networks:
      - library-network
    restart: unless-stopped

  # ----- Web Client Application -----
  web-client:
    build:
      context: ./apps/web-client
      dockerfile: docker/Dockerfile.dev
    container_name: library-web-client
    ports:
      - "4200:4200" # Angular dev server
      - "6006:6006" # Storybook
    volumes:
      # Mount source code for hot reload
      - ./apps/web-client/src:/app/src
      - ./apps/web-client/public:/app/public
      - ./apps/web-client/e2e:/app/e2e
      - ./apps/web-client/.storybook:/app/.storybook
      # Configuration files
      - ./apps/web-client/package.json:/app/package.json
      - ./apps/web-client/package-lock.json:/app/package-lock.json
      - ./apps/web-client/tsconfig.json:/app/tsconfig.json
      - ./apps/web-client/tsconfig.app.json:/app/tsconfig.app.json
      - ./apps/web-client/tsconfig.spec.json:/app/tsconfig.spec.json
      - ./apps/web-client/angular.json:/app/angular.json
      - ./apps/web-client/eslint.config.js:/app/eslint.config.js
      - ./apps/web-client/playwright.config.ts:/app/playwright.config.ts
      - ./apps/web-client/.prettierrc:/app/.prettierrc
      # Named volumes for caches (prevents overwrite by host)
      - web_client_node_modules:/app/node_modules
      - web_client_angular_cache:/app/.angular
    environment:
      - NODE_ENV=development
      - NG_CLI_ANALYTICS=false
      # API URL for HTTP calls (internal Docker network)
      - API_URL=http://api:3000
    networks:
      - library-network
    restart: unless-stopped

  # ----- PostgreSQL + pgvector -----
  postgres:
    image: pgvector/pgvector:pg16
    container_name: library-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=library
      - POSTGRES_USER=library
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Note: Schema is managed by Drizzle migrations (run via npm run db:migrate)
      # init-db.sql is kept for reference/documentation only
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U library -d library" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - library-network
    restart: unless-stopped

  # ----- Ollama (Embeddings) -----
  ollama-embeddings:
    image: ollama/ollama:latest
    container_name: library-ollama-embeddings
    ports:
      - "11434:11434"
    volumes:
      - ollama_embeddings_data:/root/.ollama
    networks:
      - library-network
    restart: unless-stopped
    # Note: After first start, run: docker exec library-ollama-embeddings ollama pull nomic-embed-text

    # ----- Ollama (Translations) -----
  ollama-translations:
    image: ollama/ollama:latest
    container_name: library-ollama-translations
    ports:
      - "11435:11434"
    volumes:
      - ollama_translations_data:/root/.ollama
    networks:
      - library-network
    restart: unless-stopped
    # Note: After first start, run: docker exec library-ollama-translations ollama pull llama3.2:1b

    # ----- Networks -----
networks:
  library-network:
    driver: bridge

volumes:
  postgres_data:
    name: library-postgres-data-prod
  ollama_embeddings_data:
    name: library-ollama-embeddings-data-prod
  ollama_translations_data:
    name: library-ollama-translations-data-prod
  api_node_modules:
    name: library-api-node-modules
  web_client_node_modules:
    name: library-web-client-node-modules
  web_client_angular_cache:
    name: library-web-client-angular-cache
