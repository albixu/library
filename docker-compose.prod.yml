# ================================
# PRODUCTION - Docker Compose
# ================================
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.prod.yml down
#   docker-compose -f docker-compose.prod.yml logs -f
#
# First-time setup (download AI models):
#   ./scripts/setup-ollama-models.sh
# ================================

services:
  # ----- Web Client (Angular + Nginx) -----
  web-client:
    build:
      context: ./apps/web-client
      dockerfile: docker/Dockerfile
      args:
        API_URL: ${API_URL:-http://localhost:3000}
    container_name: library-web
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - library-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # ----- API Application -----
  api:
    build:
      context: ./apps/api
      dockerfile: docker/Dockerfile
    container_name: library-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
      - DATABASE_URL=postgresql://library:${POSTGRES_PASSWORD}@postgres:5432/library
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=nomic-embed-text
      - TRANSLATION_MODEL=qwen2.5:3b
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - library-network
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ----- PostgreSQL + pgvector -----
  postgres:
    image: pgvector/pgvector:pg16
    container_name: library-postgres
    # In production, don't expose port externally (only internal network)
    # ports:
    #   - "5432:5432"
    environment:
      - POSTGRES_DB=library
      - POSTGRES_USER=library
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/db/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - library-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ----- Ollama (Embeddings + Translation) -----
  ollama:
    image: ollama/ollama:latest
    container_name: library-ollama
    # In production, don't expose port externally
    # ports:
    #   - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - library-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

# ----- Networks -----
networks:
  library-network:
    driver: bridge

# ----- Volumes -----
volumes:
  postgres_data:
    name: library-postgres-data-prod
  ollama_data:
    name: library-ollama-data-prod
